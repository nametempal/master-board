<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Dashboard Switcher</title>
    <meta name="description" content="Auto-switching master dashboard combining Delivery and TV dashboards">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        .iframe-container iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            overflow: hidden;
            display: block;
        }

        .iframe-container.hidden {
            display: none;
        }

        .iframe-container.visible {
            display: block;
            z-index: 1;
        }

        /* Countdown Timer */
        #countdown-timer {
            position: fixed;
            bottom: 12px;
            right: 16px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: opacity 0.4s ease, transform 0.3s ease;
            opacity: 0.5;
            user-select: none;
        }

        #countdown-timer:hover {
            opacity: 1;
            transform: scale(1.05);
            background: rgba(0, 0, 0, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
        }

        #countdown-timer .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
            /* Removed animation to reduce GPU/CPU load on low-end Linux devices */
        }

        #countdown-timer .label {
            color: rgba(255, 255, 255, 0.45);
            font-size: 11px;
        }

        #countdown-timer .time {
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="frame-delivery" class="iframe-container visible">
        <iframe src="https://nametempal.github.io/delivery-dashboard/" 
                scrolling="no" 
                allowfullscreen
                title="Delivery Dashboard"></iframe>
    </div>

    <div id="frame-tv" class="iframe-container hidden">
        <iframe src="about:blank" 
                scrolling="no" 
                allowfullscreen
                title="TV Dashboard"></iframe>
    </div>

    <div id="countdown-timer" title="Click to switch now">
        <span class="dot"></span>
        <span class="label">Next</span>
        <span class="time" id="timer-display">05:00</span>
    </div>

    <script>
        const SWITCH_INTERVAL = 300; // seconds
        const PRELOAD_TIME = 10; // seconds before switch to preload iframe

        const URL_DELIVERY = 'https://nametempal.github.io/delivery-dashboard/';
        const URL_TV = 'https://nametempal.github.io/tv-dashboard/';

        const frameDelivery = document.getElementById('frame-delivery');
        const frameTv = document.getElementById('frame-tv');
        const iframeDelivery = frameDelivery.querySelector('iframe');
        const iframeTv = frameTv.querySelector('iframe');
        const timerDisplay = document.getElementById('timer-display');
        const timerEl = document.getElementById('countdown-timer');

        let remaining = SWITCH_INTERVAL;
        let currentFrame = 'delivery'; // starts with delivery

        function formatTime(sec) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function switchDashboard() {
            if (currentFrame === 'delivery') {
                // Failsafe: if not preloaded, load it now
                if (!iframeTv.src.includes('tv-dashboard')) iframeTv.src = URL_TV;
                frameDelivery.classList.replace('visible', 'hidden');
                frameTv.classList.replace('hidden', 'visible');
                // Unload Delivery dashboard 1s after hiding to kill its JS processes and API calls
                setTimeout(() => iframeDelivery.src = 'about:blank', 1000);
                currentFrame = 'tv';
            } else {
                // Failsafe
                if (!iframeDelivery.src.includes('delivery-dashboard')) iframeDelivery.src = URL_DELIVERY;
                frameTv.classList.replace('visible', 'hidden');
                frameDelivery.classList.replace('hidden', 'visible');
                // Unload TV dashboard
                setTimeout(() => iframeTv.src = 'about:blank', 1000);
                currentFrame = 'delivery';
            }
            remaining = SWITCH_INTERVAL;
            timerDisplay.textContent = formatTime(remaining);
        }

        function handleTick() {
            remaining--;

            // OPTIMIZATION: Preload the next dashboard 10 seconds before switching
            if (remaining === PRELOAD_TIME) {
                if (currentFrame === 'delivery') {
                    iframeTv.src = URL_TV;
                } else {
                    iframeDelivery.src = URL_DELIVERY;
                }
            }

            if (remaining <= 0) {
                switchDashboard();
            } else {
                timerDisplay.textContent = formatTime(remaining);
            }
        }

        // Force load next iframe before switching if user manually triggers it
        function manualSwitch() {
            if (currentFrame === 'delivery' && !iframeTv.src.includes('tv-dashboard')) iframeTv.src = URL_TV;
            if (currentFrame === 'tv' && !iframeDelivery.src.includes('delivery-dashboard')) iframeDelivery.src = URL_DELIVERY;
            // Tiny delay to ensure src is set before visibility toggle
            setTimeout(switchDashboard, 50);
        }

        // Click timer to switch immediately
        timerEl.addEventListener('click', manualSwitch);

        // Arrow key navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                manualSwitch();
            }
        });

        // setInterval at 1s is more CPU-efficient than rAF (1 wake/sec vs 60 wakes/sec)
        setInterval(handleTick, 1000);

        // Initial display
        timerDisplay.textContent = formatTime(remaining);
    </script>

</body>
</html>
